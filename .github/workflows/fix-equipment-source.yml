name: Fix equipment source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-equipment-source.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair equipment.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('equipment.html')
          s = p.read_text(encoding='utf-8')

          # Replace the whole admin-login function with a known-valid implementation.
          start = s.find('function showAdminLogin() {')
          end = s.find('async function openInspectionScheduleModal()', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate showAdminLogin block')
          replacement = r'''function showAdminLogin() {
            Swal.fire({
                title: '<i class="fas fa-user-shield"></i> เข้าสู่ระบบแอดมิน',
                html: '<input type="text" id="adminUser" class="swal2-input" placeholder="ชื่อผู้ใช้" autocomplete="username">' +
                      '<input type="password" id="adminPass" class="swal2-input" placeholder="รหัสผ่าน" autocomplete="current-password">',
                confirmButtonColor: '#003366',
                confirmButtonText: 'เข้าสู่ระบบ',
                showCancelButton: true,
                cancelButtonText: 'ยกเลิก',
                focusConfirm: false,
                preConfirm: async () => {
                    const user = document.getElementById('adminUser').value.trim();
                    const pass = document.getElementById('adminPass').value.trim();
                    if (!user || !pass) {
                        Swal.showValidationMessage('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
                        return false;
                    }
                    try {
                        const response = await fetch('https://aqhrfwqbroezrrcenyyb.supabase.co/functions/v1/ward-directory', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'adminLogin', username: user, password: pass })
                        });
                        const result = await response.json();
                        if (!response.ok || result.status !== 'success') {
                            Swal.showValidationMessage(result.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                            return false;
                        }
                        return true;
                    } catch (error) {
                        console.error('Admin login error:', error);
                        Swal.showValidationMessage('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
                        return false;
                    }
                }
            }).then((result) => {
                if (!result.isConfirmed) return;
                isAdminLoggedIn = true;
                sessionStorage.setItem('aide_role', 'admin');
                document.getElementById('btnAdminLogin').style.display = 'none';
                document.getElementById('tab-admin').classList.remove('hidden-tab');
                updateWorkspaceMeta();
                updateInspectionWindowNotice();
                Swal.fire({
                    icon: 'success',
                    title: 'เข้าสู่ระบบสำเร็จ',
                    text: 'กำลังดึงข้อมูลภาพรวมทั้งโรงพยาบาล...',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => { fetchAllEquipmentForAdmin(); });
            });
        }

        '''
          s = s[:start] + replacement + s[end:]

          # Make the equipment client use the fixed Supabase Edge Function directly.
          s = re.sub(
              r'const EQUIPMENT_API = \\"https://script\\.google\\.com/macros/s/[^\"]+/exec\\";?',
              'const EQUIPMENT_API = "https://aqhrfwqbroezrrcenyyb.supabase.co/functions/v1/equipment-api";',
              s,
              count=1,
          )

          # Prevent accidental re-introduction of the old cloth-exchange auth endpoint in this module.
          if 'functions/v1/cloth-exchange' in s:
              s = s.replace('https://aqhrfwqbroezrrcenyyb.supabase.co/functions/v1/cloth-exchange',
                            'https://aqhrfwqbroezrrcenyyb.supabase.co/functions/v1/ward-directory')

          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s = Path('equipment.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.I|re.S)
          Path('/tmp/equipment-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/equipment-inline.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipment.html
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'fix equipment html syntax and use supabase api'
          git push
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm -f .github/workflows/fix-equipment-source.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'chore remove one-time equipment repair workflow'
          git push
