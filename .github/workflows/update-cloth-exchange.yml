name: Update cloth exchange workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[cloth-exchange-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch cloth exchange UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('cloth-exchange.html')
          text = path.read_text(encoding='utf-8')

          # 1) Standardize all shift selectors to ดึก -> เช้า -> บ่าย.
          # Only reorder the known option values; do not modify unrelated text.
          option_pattern = re.compile(
              r'(\s*<option value="">เลือกเวร</option>\s*)'
              r'<option value="เช้า">เช้า</option>\s*'
              r'<option value="บ่าย">บ่าย</option>\s*'
              r'<option value="ดึก">ดึก</option>'
          )
          text = option_pattern.sub(
              lambda m: m.group(1)
              + '<option value="ดึก">ดึก</option>\n'
              + '                                        <option value="เช้า">เช้า</option>\n'
              + '                                        <option value="บ่าย">บ่าย</option>',
              text,
          )

          # Also reorder the edit-select variants that include selected attributes.
          edit_pattern = re.compile(
              r'(<option value="">เลือกเวร</option>\s*)'
              r'<option value="เช้า"\s*([^>]*)>เช้า</option>\s*'
              r'<option value="บ่าย"\s*([^>]*)>บ่าย</option>\s*'
              r'<option value="ดึก"\s*([^>]*)>ดึก</option>'
          )
          def edit_repl(m):
              a, b, c = m.group(2), m.group(3), m.group(4)
              return (
                  m.group(1)
                  + f'<option value="ดึก" {c}>ดึก</option>\n'
                  + f'<option value="เช้า" {a}>เช้า</option>\n'
                  + f'<option value="บ่าย" {b}>บ่าย</option>'
              )
          text = edit_pattern.sub(edit_repl, text)

          # 2) Add the unit-side cancellation action to request list rows.
          marker = '        function buildUnitActionButtons(row) {'
          if 'function cancelExchangeRequest(requestId' not in text:
              cancel_fn = r'''        async function cancelExchangeRequest(requestId) {
            const row = unitRequests.find(item => String(item.requestId) === String(requestId));
            if (!row || row.status !== 'submitted') {
                Swal.fire({ icon: 'warning', title: 'ไม่สามารถยกเลิกใบเบิกนี้ได้', text: 'ยกเลิกได้เฉพาะใบเบิกที่ยังไม่ถูกรับโดยซักฟอก' });
                return;
            }

            const result = await Swal.fire({
                title: `ยกเลิกใบเบิก ${row.requestNo}`,
                input: 'textarea',
                inputLabel: 'เหตุผลการยกเลิก',
                inputPlaceholder: 'เช่น เบิกผิดรอบเวร, เปลี่ยนจำนวนเบิก, ไม่มีความจำเป็นแล้ว',
                inputAttributes: { 'aria-label': 'เหตุผลการยกเลิก' },
                showCancelButton: true,
                confirmButtonText: 'ยืนยันยกเลิกใบเบิก',
                cancelButtonText: 'กลับ',
                confirmButtonColor: '#c44f4f',
                inputValidator: value => value && value.trim() ? '' : 'กรุณาระบุเหตุผลการยกเลิก'
            });
            if (!result.isConfirmed) return;

            try {
                await withLoadingPopup('กำลังยกเลิกใบเบิก...', async () => {
                    const response = await fetch(EXCHANGE_API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'cancelExchangeRequest',
                            requestId,
                            ward: currentWard,
                            requesterName: row.requesterName || '',
                            reason: result.value.trim()
                        })
                    });
                    const payload = await response.json();
                    if (!response.ok || payload.status !== 'success') {
                        throw new Error(payload.message || 'ยกเลิกใบเบิกไม่สำเร็จ');
                    }
                });

                exchangeRequestDetailCache.delete(requestId);
                selectedUnitRequest = null;
                await fetchWardRequests();
                syncNotifications('unit', unitRequests);
                renderUnitWorkspace();
                closeRecordModal();
                showSuccessToast('ยกเลิกใบเบิกเรียบร้อยแล้ว');
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'ยกเลิกใบเบิกไม่สำเร็จ', text: error.message || 'เกิดข้อผิดพลาด' });
            }
        }

'''
              if marker not in text:
                  raise SystemExit('Cannot find buildUnitActionButtons marker')
              text = text.replace(marker, cancel_fn + marker, 1)

          old = """            if (['partial_issued', 'issued_waiting_receipt'].includes(row.status)) {\n                actions.unshift(`<button class=\"table-btn success\" type=\"button\" onclick=\"openUnitRequestForReceipt('${escapeJs(row.requestId)}')\">ลงรับผ้า</button>`);\n            }\n            return `<div class=\"table-action-group\">${actions.join('')}</div>`;"""
          new = """            if (['partial_issued', 'issued_waiting_receipt'].includes(row.status)) {\n                actions.unshift(`<button class=\"table-btn success\" type=\"button\" onclick=\"openUnitRequestForReceipt('${escapeJs(row.requestId)}')\">ลงรับผ้า</button>`);\n            }\n            if (row.status === 'submitted') {\n                actions.push(`<button class=\"table-btn\" style=\"background:#c44f4f;\" type=\"button\" onclick=\"cancelExchangeRequest('${escapeJs(row.requestId)}')\">ยกเลิกใบเบิก</button>`);\n            }\n            return `<div class=\"table-action-group\">${actions.join('')}</div>`;"""
          if old in text:
              text = text.replace(old, new, 1)
          else:
              raise SystemExit('Cannot find buildUnitActionButtons status block')

          # Keep the main request-list buttons and detail modal in sync by making the
          # cancellation function available from the detail view as well.
          detail_patterns = [
              "${canEdit ? `<button class=\"primary-btn\" type=\"button\" onclick=\"openEditUnitRequest()\">แก้ไขใบเบิก</button>` : ''}",
          ]
          for old_detail in detail_patterns:
              new_detail = (
                  "${canEdit ? `<button class=\"primary-btn\" type=\"button\" onclick=\"openEditUnitRequest()\">แก้ไขใบเบิก</button>` : ''}"
                  "${canEdit ? `<button class=\"table-btn\" style=\"background:#c44f4f;\" type=\"button\" onclick=\"cancelExchangeRequest('${escapeJs(detail.header.requestId)}')\">ยกเลิกใบเบิก</button>` : ''}"
              )
              text = text.replace(old_detail, new_detail)

          path.write_text(text, encoding='utf-8')

          # 3) Keep the HTML app version visibly ahead of the old cached version.
          version_path = Path('app-version.json')
          if version_path.exists():
              import json
              data = json.loads(version_path.read_text(encoding='utf-8'))
              data['version'] = '2026.09.10.7'
              version_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit and cleanup workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloth-exchange.html app-version.json
          git commit -m "Apply cloth exchange updates [cloth-exchange-patched]" || exit 0
          git push
          git rm .github/workflows/update-cloth-exchange.yml
          git commit -m "Remove one-time cloth exchange patch workflow"
          git push
