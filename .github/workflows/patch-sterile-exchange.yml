name: Patch sterile exchange

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[sterile-exchange-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch sterile exchange UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('sterile-exchange.html')
          text = html.read_text(encoding='utf-8')
          old = '''                  <option value="">เลือกเวร</option>\n                  <option value="เช้า">เช้า</option>\n                  <option value="บ่าย">บ่าย</option>'''
          new = '''                  <option value="">เลือกเวร</option>\n                  <option value="ดึก">ดึก</option>\n                  <option value="เช้า">เช้า</option>\n                  <option value="บ่าย">บ่าย</option>'''
          if old not in text:
              raise SystemExit('shift selector pattern not found in sterile-exchange.html')
          text = text.replace(old, new, 1)
          html.write_text(text, encoding='utf-8')

          js = Path('sterile-exchange.app.js')
          text = js.read_text(encoding='utf-8')

          if 'STERILE_CANCEL_API' not in text:
              text = text.replace(
                  "const DEMO_MODE = false;",
                  "const DEMO_MODE = false;\nconst STERILE_CANCEL_API = 'https://aqhrfwqbroezrrcenyyb.supabase.co/functions/v1/sterile-cancel';",
                  1,
              )

          if 'async function cancelSterileRequest(' not in text:
              marker = 'function rowHtmlUser(r) {'
              cancel_fn = r'''async function cancelSterileRequest(requestId) {
  const row = userRequests.find(item => String(item.requestId) === String(requestId));
  if (!row || row.status !== 'submitted') {
    Swal.fire({ icon: 'warning', title: 'ไม่สามารถยกเลิกใบเบิกนี้ได้', text: 'ยกเลิกได้เฉพาะใบที่ยังไม่ถูกรับโดยจ่ายกลาง' });
    return;
  }

  const result = await Swal.fire({
    title: `ยกเลิกใบเบิก ${row.requestNo}`,
    input: 'textarea',
    inputLabel: 'เหตุผลการยกเลิก',
    inputPlaceholder: 'กรุณาระบุเหตุผล เช่น เบิกผิดเวร / เปลี่ยนรายการ / ไม่ต้องการเบิกแล้ว',
    showCancelButton: true,
    confirmButtonText: 'ยืนยันยกเลิก',
    cancelButtonText: 'กลับ',
    confirmButtonColor: '#c44f4f',
    inputValidator: value => value && value.trim() ? undefined : 'กรุณาระบุเหตุผลการยกเลิก'
  });
  if (!result.isConfirmed) return;

  try {
    const response = await fetch(STERILE_CANCEL_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requestId,
        ward: currentWard,
        requesterName: row.requesterName || '',
        reason: result.value.trim()
      })
    });
    const payload = await response.json();
    if (!response.ok || payload.status !== 'success') {
      throw new Error(payload.message || 'ยกเลิกใบเบิกไม่สำเร็จ');
    }
    toast('success', 'ยกเลิกใบเบิกเรียบร้อยแล้ว');
    await loadUserWorkspace();
  } catch (err) {
    Swal.fire({ icon: 'error', title: 'ยกเลิกใบเบิกไม่สำเร็จ', text: err.message || 'เกิดข้อผิดพลาด' });
  }
}

'''
              if marker not in text:
                  raise SystemExit('rowHtmlUser marker not found')
              text = text.replace(marker, cancel_fn + marker, 1)

          target = '''  if (r.status === 'submitted') {\n    actionBtn += `<button class="table-btn primary" onclick="editRequest('${r.requestId}')"><i class="fas fa-pen"></i> แก้ไข</button>`;\n    actionBtn += `<button class="table-btn secondary" onclick="printRequest('${r.requestId}','issue')"><i class="fas fa-print"></i> พิมพ์ใบเบิก</button>`;\n  }'''
          replacement = '''  if (r.status === 'submitted') {\n    actionBtn += `<button class="table-btn primary" onclick="editRequest('${r.requestId}')"><i class="fas fa-pen"></i> แก้ไข</button>`;\n    actionBtn += `<button class="table-btn secondary" onclick="printRequest('${r.requestId}','issue')"><i class="fas fa-print"></i> พิมพ์ใบเบิก</button>`;\n    actionBtn += `<button class="table-btn" style="background:#c44f4f;color:#fff;" onclick="cancelSterileRequest('${r.requestId}')"><i class="fas fa-ban"></i> ยกเลิกใบเบิก</button>`;\n  }'''
          if target not in text:
              raise SystemExit('submitted action block not found')
          text = text.replace(target, replacement, 1)

          js.write_text(text, encoding='utf-8')
          PY

      - name: Bump app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('app-version.json')
          if p.exists():
              data = json.loads(p.read_text(encoding='utf-8'))
              data['version'] = '2026.09.10.8'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sterile-exchange.html sterile-exchange.app.js app-version.json
          git commit -m "Update sterile exchange cancellation and shifts [sterile-exchange-patched]"
          git push
          git rm .github/workflows/patch-sterile-exchange.yml
          git commit -m "Remove one-time sterile exchange patch workflow"
          git push
