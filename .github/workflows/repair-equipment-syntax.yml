name: Repair equipment.html syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[equipment-syntax-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair equipment.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('equipment.html')
          text = path.read_text(encoding='utf-8')

          start_marker = '        // ระบบจัดการแอดมิน (Admin Mode)\n        // ==========================================\n        function showAdminLogin() {'
          end_marker = '        async function openInspectionScheduleModal() {'

          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('showAdminLogin block markers not found')

          fixed = '''        // ระบบจัดการแอดมิน (Admin Mode)
        // ==========================================
        function showAdminLogin() {
            Swal.fire({
                title: 'เข้าสู่ระบบผู้ดูแล',
                html: `
                    <input type="text" id="adminUser" class="swal-input" placeholder="ชื่อผู้ใช้" style="margin-bottom: 10px; box-sizing: border-box;">
                    <input type="password" id="adminPass" class="swal-input" placeholder="รหัสผ่าน" style="box-sizing: border-box;">
                `,
                confirmButtonText: 'เข้าสู่ระบบ',
                confirmButtonColor: '#003366',
                focusConfirm: false,
                preConfirm: async () => {
                    const user = Swal.getPopup().querySelector('#adminUser').value.trim();
                    const pass = Swal.getPopup().querySelector('#adminPass').value.trim();
                    if (!user || !pass) {
                        Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบ');
                        return false;
                    }
                    try {
                        const response = await fetch('https://aqhrfwqbroezrrcenyyb.supabase.co/functions/v1/ward-directory', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'adminLogin', username: user, password: pass })
                        });
                        const result = await response.json();
                        if (!response.ok || result.status !== 'success') {
                            Swal.showValidationMessage(result.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                            return false;
                        }
                        return true;
                    } catch (err) {
                        console.error('Admin login error:', err);
                        Swal.showValidationMessage('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
                        return false;
                    }
                }
            }).then((result) => {
                if (!result.isConfirmed) return;

                isAdminLoggedIn = true;
                sessionStorage.setItem('aide_role', 'admin');
                document.getElementById('btnAdminLogin').style.display = 'none';
                document.getElementById('tab-admin').classList.remove('hidden-tab');
                updateWorkspaceMeta();
                updateInspectionWindowNotice();

                Swal.fire({
                    icon: 'success',
                    title: 'เข้าสู่ระบบสำเร็จ',
                    text: 'กำลังดึงข้อมูลภาพรวมทั้งโรงพยาบาล...',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => { fetchAllEquipmentForAdmin(); });
            });
        }

'''

          text = text[:start] + fixed + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit repaired file
        shell: bash
        run: |
          if git diff --quiet -- equipment.html; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipment.html
          git commit -m "Fix equipment.html syntax error [equipment-syntax-repaired]"
          git push

      - name: Remove repair workflow
        if: success()
        shell: bash
        run: |
          git rm -f .github/workflows/repair-equipment-syntax.yml || true
          git commit -m "Remove one-time equipment repair workflow" || true
          git push || true
