name: Migrate Cloth Stock frontend to Supabase
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Cloth Stock API to Supabase
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloth-stock.html')
          s=p.read_text(encoding='utf-8')
          old='https://script.google.com/macros/s/AKfycbzwM6TeMj3vZHoUYZoNgox7g0cZR6XJDPcZxORoOcyJ4fPmA4OcIc40j9kSz-SnWcA/exec'
          new='https://aqhrfwqbroezrrcenyyb.supabase.co/functions/v1/cloth-stock'
          if old not in s:
              raise SystemExit('Legacy Cloth Stock API URL not found; refusing to modify the file.')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit migration and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloth-stock.html
          git rm .github/workflows/migrate-cloth-stock.yml
          git commit -m 'Migrate Cloth Stock frontend to Supabase'
          git push
